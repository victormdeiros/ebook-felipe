name: Vercel + Supabase validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      check_supabase:
        description: "Verify Supabase database and Storage (read only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-ebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run test:api
      - run: npm test
      - run: npm run build

  supabase:
    if: github.event_name == 'workflow_dispatch' && inputs.check_supabase
    needs: validate
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: heusjcoijobbsgzyfupm
      SUPABASE_URL: https://heusjcoijobbsgzyfupm.supabase.co
      SUPABASE_STORAGE_BUCKET: ebook-manual
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_SSL_CA: ${{ secrets.SUPABASE_DATABASE_SSL_CA }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      # SELECT and bucket metadata only. No migration, seed, copy or deploy.
      - run: npm run check:supabase --prefix server
